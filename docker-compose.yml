
services:
  postgres:
    image: postgres:16-alpine
    container_name: crime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crime_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - crime_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    container_name: crime_metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - crime_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

  prefect-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: crime-trend-monitor:local
    container_name: crime_prefect_server
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_HOME: /opt/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - crime_prefect_data:/opt/prefect
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  crime-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: crime-trend-monitor:local
    container_name: crime_pipeline
    restart: unless-stopped
    command:
      - python
      - -c
      - "from pipeline.flow import crime_pipeline; crime_pipeline.serve(name='daily-crime-monitor', cron='30 18 * * *')"
    environment:
      DATABASE_TYPE: postgresql
      SOCRATA_DOMAIN: ${SOCRATA_DOMAIN:-data.cambridgema.gov}
      SOCRATA_DATASET_ID: ${SOCRATA_DATASET_ID:-3gki-wyrb}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: 5432
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BATCH_SIZE: ${BATCH_SIZE:-5000}
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: crime-trend-monitor:local
    container_name: crime_frontend
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      DATABASE_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_DEPLOYMENT_NAME: Cambridge Crime Monitoring Pipeline/daily-crime-monitor
      SOCRATA_DOMAIN: ${SOCRATA_DOMAIN:-data.cambridgema.gov}
      SOCRATA_DATASET_ID: ${SOCRATA_DATASET_ID:-3gki-wyrb}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  crime_postgres_data:
  crime_pgadmin_data:
  crime_metabase_data:
  crime_prefect_data:
